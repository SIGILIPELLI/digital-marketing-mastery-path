site_name: Digital Marketing & SEO Mastery Path
site_description: A structured, module-wise digital marketing and SEO training program from entry level to master level, covering SEO, Google Ads, Meta Ads, email, content, analytics and growth strategy.
site_url: https://learnmasterypath.com/digital-marketing-mastery-path/
repo_url: https://github.com/SIGILIPELLI/digital-marketing-mastery-path
repo_name: digital-marketing-mastery-path

theme:
  name: material
  font: false
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.path
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js






extra:
  related:
    - name: "Excel"
      url: https://learnmasterypath.com/excel-mastery-path/
    - name: "Product Manager"
      url: https://learnmasterypath.com/product-manager-mastery-path/
    - name: "AI Tools"
      url: https://learnmasterypath.com/ai-tools-mastery-path/
    - name: "English Fluency & IELTS"
      url: https://learnmasterypath.com/english-fluency-mastery-path/
    - name: "Workday"
      url: https://learnmasterypath.com/workday-mastery-path/

